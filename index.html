<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Analytics Terminal</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151821;
            --border-color: #2a2e39;
            --text-color: #d1d4dc;
            --accent-green: #26a69a;
            --accent-red: #ef5350;
            --accent-blue: #2962ff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        .chart-box {
            position: relative;
            height: 350px;
            width: 100%;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            color: #8f939d;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            background: #0b0e14;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .btn-submit {
            grid-column: span 4;
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #1e54e4;
        }

        @media (max-width: 800px) {
            .grid-layout { grid-template-columns: 1fr; }
            .form-grid { grid-template-columns: 1fr 1fr; }
            .btn-submit { grid-column: span 2; }
        }
    </style>
</head>
<body>

<div class="header">
    <h2 style="margin:0; color:#fff;">Video Performance Terminal</h2>
    <span style="color: var(--accent-green);">● Active System</span>
</div>

<div class="grid-layout">
    <!-- Candle Performance Chart -->
    <div class="card">
        <h3 style="margin-top:0; color:#8f939d; font-size: 14px;">VIDEO VIEWS CANDLESTICK CHART</h3>
        <div class="chart-box">
            <canvas id="candleChart"></canvas>
        </div>
    </div>

    <!-- Success Progress Indicator -->
    <div class="card">
        <h3 style="margin-top:0; color:#8f939d; font-size: 14px;">SUCCESS SCORE (%)</h3>
        <div class="chart-box">
            <canvas id="donutChart"></canvas>
        </div>
    </div>

    <!-- Input Form -->
    <div class="card" style="grid-column: span 2;">
        <h3 style="margin-top:0; color:#8f939d; font-size: 14px;">ENTER VIDEO METRICS (OHLC)</h3>
        <div class="form-grid">
            <div class="input-group">
                <label>OPEN (1st Hour Views)</label>
                <input type="number" id="openVal" placeholder="e.g. 100">
            </div>
            <div class="input-group">
                <label>HIGH (Peak Spike Views)</label>
                <input type="number" id="highVal" placeholder="e.g. 500">
            </div>
            <div class="input-group">
                <label>LOW (Minimum Base Views)</label>
                <input type="number" id="lowVal" placeholder="e.g. 80">
            </div>
            <div class="input-group">
                <label>CLOSE (24h Total Views)</label>
                <input type="number" id="closeVal" placeholder="e.g. 450">
            </div>
            <button class="btn-submit" onclick="addCandleData()">Add Candle to Chart</button>
        </div>
    </div>
</div>

<script>
    let labels = ['Video 1', 'Video 2'];
    let candleRanges = [[80, 500], [150, 600]]; // [Low, High]
    let candleBodies = [[100, 450], [200, 350]]; // [Open, Close]
    let colors = ['#26a69a', '#ef5350']; // Green if Close > Open, Red if Close < Open

    // Initialize Main Candlestick Chart
    const ctx = document.getElementById('candleChart').getContext('2d');
    const candleChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [
                {
                    label: 'High/Low Range',
                    data: candleRanges,
                    backgroundColor: '#58a6ff',
                    barThickness: 3,
                },
                {
                    label: 'Open/Close Body',
                    data: candleBodies,
                    backgroundColor: colors,
                    barThickness: 20,
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true,
                    grid: { color: '#2a2e39' },
                    ticks: { color: '#d1d4dc' }
                },
                x: {
                    grid: { color: '#2a2e39' },
                    ticks: { color: '#d1d4dc' }
                }
            },
            plugins: {
                legend: { display: false }
            }
        }
    });

    // Initialize Donut Chart
    const donutCtx = document.getElementById('donutChart').getContext('2d');
    const donutChart = new Chart(donutCtx, {
        type: 'doughnut',
        data: {
            labels: ['Success', 'Lagging'],
            datasets: [{
                data: [75, 25],
                backgroundColor: ['#26a69a', '#ef5350'],
                borderWidth: 0
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '70%',
            plugins: {
                legend: { position: 'bottom', labels: { color: '#d1d4dc' } }
            }
        }
    });

    // Add Candle Function
    function addCandleData() {
        const open = parseFloat(document.getElementById('openVal').value);
        const high = parseFloat(document.getElementById('highVal').value);
        const low = parseFloat(document.getElementById('lowVal').value);
        const close = parseFloat(document.getElementById('closeVal').value);

        if (isNaN(open) || isNaN(high) || isNaN(low) || isNaN(close)) {
            alert('براہ کرم چاروں خانوں میں صحیح نمبر درج کریں!');
            return;
        }

        // Add Label
        const nextVideoIndex = labels.length + 1;
        labels.push('Video ' + nextVideoIndex);

        // Add Range & Body Data
        candleRanges.push([low, high]);
        candleBodies.push([open, close]);

        // Color logic: Green for profit/growth, Red for drop
        if (close >= open) {
            colors.push('#26a69a'); // Green
        } else {
            colors.push('#ef5350'); // Red
        }

        // Update Charts
        candleChart.update();

        // Update Donut Progress
        let score = Math.min(100, Math.round((close / high) * 100));
        donutChart.data.datasets[0].data = [score, 100 - score];
        donutChart.update();

        // Clear Inputs
        document.getElementById('openVal').value = '';
        document.getElementById('highVal').value = '';
        document.getElementById('lowVal').value = '';
        document.getElementById('closeVal').value = '';
    }
</script>
</body>
</html>
